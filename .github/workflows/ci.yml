# 手元のフック（lefthook）と同じ確かめ。main には直接 push しているので、push でも回す。
# 依存の更新（Renovate）の PR は手元を通らないので、ここが唯一の確かめ
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm exec prettier --check '**/*.{ts,tsx,mjs,json,css,yml}'

      - run: pnpm secretlint

      - run: pnpm test

      - run: pnpm knip

      - run: pnpm build
