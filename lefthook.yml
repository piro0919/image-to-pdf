pre-commit:
  parallel: true
  commands:
    eslint:
      glob: '**/*.{ts,tsx,mjs}'
      run: npx eslint --fix {staged_files}
      stage_fixed: true
    prettier:
      glob: '**/*.{ts,tsx,mjs,json,css,yml}'
      run: npx prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    secretlint:
      glob: '**/*'
      exclude: '**/*.{png,jpg}'
      run: npx secretlint --maskSecrets {staged_files}
    typescript:
      glob: '**/*.{ts,tsx}'
      run: pnpm typecheck
commit-msg:
  scripts:
    'commitlint.sh':
      runner: bash
pre-push:
  commands:
    test:
      run: pnpm test
